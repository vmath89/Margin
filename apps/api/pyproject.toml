[project]
name = "margin-api"
version = "0.1.0"
description = "FastAPI backend for the Margin reading companion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.5,<2",
  "fastapi>=0.116.1,<1",
  "pdfplumber==0.11.7",
  "pydantic-settings>=2.10.1,<3",
  "pypdf==6.1.1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.uv]
default-groups = ["dev"]
